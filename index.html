<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>배너 리스트</title>

<style>
body {
    margin: 0;
    padding: 40px;
    font-family: Arial, sans-serif;
    background: #f5f6f8;
    color: #222;
}

h1 {
    margin: 0 0 30px;
}

.category-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    max-width: 1000px;
}

.category {
    display: block;
    padding: 30px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 12px;
    color: #222;
    text-decoration: none;
    box-shadow: 0 3px 10px rgba(0,0,0,0.06);
    transition: 0.2s;
}

.category:hover {
    transform: translateY(-3px);
    border-color: #999;
}

.category h2 {
    margin: 0;
    font-size: 20px;
}
</style>
</head>

<body>

<h1>배너 리스트</h1>

    </a>

    <a class="category" href="book.html">

    </a>

    <a class="category" href="mo-teacher.html">

    </a>

</div>

</body>
