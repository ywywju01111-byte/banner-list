  });

   const moved=dragState.moved;dragState=null;b.classList.remove('dragging');
   if(!moved)return;
   b.dataset.suppressClick='yes';
   // Hit-test the underlying page, not the sticker overlay.
   b.style.pointerEvents='none';

   b.style.pointerEvents='';
   const section=target?.closest('section');
   if(section){
    const candidate=target.closest('.tabs,.tab,.count,.side-nav,.compare,.paper-wrap,.paper-title,.case-head,.pointbox,.head,.custom-heading,.custom-content,.custom-section,.hero h1,.hero p,.quiz h2,.quiz p,.proof h2,.proof p,.eventbox h2,.eventbox p,.steps,.step,.example,.form')||section;

  b.addEventListener('mouseleave',()=>tip.style.display='none');
  layer.append(b);
 });
 updatePositions();
}
function openEditor(i){current=i;document.getElementById('planTitleV4').value=notes[i].title;document.getElementById('planTextV4').value=notes[i].note;editor.style.display='block'}

function selectorFor(el){
 if(el.id)return '#'+CSS.escape(el.id);
 let parts=[];
 for(let node=el;node&&node!==document.body;node=node.parentElement){
  if(node.id){parts.unshift('#'+CSS.escape(node.id));break}
  const siblings=Array.from(node.parentElement.children).filter(x=>x.tagName===node.tagName);
  parts.unshift(node.tagName.toLowerCase()+':nth-of-type('+(siblings.indexOf(node)+1)+')');
 }
 return parts.join(' > ');
}

 window.prepareCustomSectionsExport?.(clone);

 link.href=url;link.download='page_builder_editable.html';document.body.appendChild(link);link.click();link.remove();

};

<script id="custom-sections-script">

const titleField=modal.querySelector('#customMainTitle'),subField=modal.querySelector('#customSubTitle'),colField=modal.querySelector('#customCols'),rowField=modal.querySelector('#customRows');

function edit(sec){editing=sec;pending=null;bodyWrap.style.display=sec.dataset.customType==='text'?'block':'none';bodyField.value=sec.querySelector('.custom-text-body')?.textContent||'';alignField.value=sec.dataset.align||'center';titleField.value=sec.querySelector('.custom-heading h2')?.textContent||'';subField.value=sec.querySelector('.custom-heading p')?.textContent||'';bgMode.value=sec.dataset.bgMode||'base';bgColor.value=sec.style.getPropertyValue('--custom-bg').trim()||'#282028';bgColor.disabled=bgMode.value!=='custom';modal.querySelector('#customModalHeading').textContent='영역 수정';modal.querySelector('#customTableSettings').style.display='none';modal.querySelector('#customRegister').textContent='수정 완료';modal.classList.add('open');titleField.focus()}
function begin(type,target,before){pending={type,target,before};editing=null;bodyWrap.style.display=type==='text'?'block':'none';bodyField.value='';alignField.value='center';titleField.value='';subField.value='';colField.value=3;rowField.value=2;bgMode.value='auto';bgColor.value='#282028';bgColor.disabled=true;modal.querySelector('#customModalHeading').textContent=type==='table'?'새 표 영역 등록':'새 텍스트 영역 등록';modal.querySelector('#customTableSettings').style.display=type==='table'?'grid':'none';modal.querySelector('#customRegister').textContent='등록';modal.classList.add('open');titleField.focus()}
function make(type,heading,sub,cols=3,rows=2,body='',align='center'){
 const sec=document.createElement('section');sec.className='custom-section';sec.dataset.customType=type;sec.dataset.align=align;sec.id=uid();
 const inner=document.createElement('div');inner.className='custom-inner';sec.append(inner);
 const tools=document.createElement('div');tools.className='section-tools';inner.append(tools);
 const content=document.createElement('div');content.className='custom-content';inner.append(content);
 const head=document.createElement('div');head.className='custom-heading';

 const p=document.createElement('p');p.textContent=sub||'서브 타이틀을 입력하세요.';head.append(h,p);content.append(head);
 if(type==='text'){const bodyEl=document.createElement('div');bodyEl.className='custom-text-body';bodyEl.textContent=body;content.append(bodyEl)}
 if(type==='table'){
  const bar=document.createElement('div');bar.className='table-tools';content.append(bar);
  const scroll=document.createElement('div');scroll.className='table-scroll';const table=document.createElement('table');const thead=table.createTHead(),tr=thead.insertRow();
  for(let c=0;c<cols;c++){const th=document.createElement('th');th.textContent='항목 '+(c+1);tr.append(th)}
  const tbody=table.createTBody();for(let r=0;r<rows;r++){const tr=tbody.insertRow();for(let c=0;c<cols;c++)tr.insertCell().textContent='내용 입력'}

modal.querySelector('#customRegister').onclick=()=>{
 const heading=titleField.value.trim()||'메인 타이틀을 입력하세요.';

<script id="original-section-editor-script">

function normalizeHeroImageUrl(value){
 let url=value.trim();
 try{
  const u=new URL(url);
  if(u.hostname==='github.com'){
   const m=u.pathname.match(/^\/([^/]+)\/([^/]+)\/blob\/([^/]+)\/(.+)$/);

  }
  if(u.hostname==='drive.google.com'){
   const m=u.pathname.match(/\/file\/d\/([^/]+)/);
   if(m)url='https://drive.google.com/uc?export=view&id='+encodeURIComponent(m[1]);

 heroModal.querySelector('#heroLine1').value=h?.childNodes[0]?.textContent.trim()||'';
 heroModal.querySelector('#heroLine2').value=h?.querySelector('em')?.textContent||'';
 heroModal.querySelector('#heroDescription').value=(p?.innerText||'').replace(/\n{3,}/g,'\n\n');
 heroModal.querySelector('#heroIconMode').value=scope?.dataset.iconMode||'default';
 heroModal.querySelector('#heroIconUrl').value=(scope?.querySelector('.hero-icon-image')?.getAttribute('src')||'').startsWith('data:')?'':(scope?.querySelector('.hero-icon-image')?.getAttribute('src')||'');uploadedPng=null;fileInput.value='';
 heroModal.classList.add('open');
}
heroModal.querySelector('#heroEditCancel').onclick=()=>heroModal.classList.remove('open');
heroModal.addEventListener('click',e=>{if(e.target===heroModal)heroModal.classList.remove('open')});
heroModal.querySelector('#heroEditSave').onclick=()=>{
 const sec=heroSection,h=sec.querySelector('h1'),p=sec.querySelector('.inner > p'),scope=sec.querySelector('.scope');
 const first=heroModal.querySelector('#heroLine1').value,second=heroModal.querySelector('#heroLine2').value,desc=heroModal.querySelector('#heroDescription').value;
 h.replaceChildren(document.createTextNode(first),document.createElement('br'));
 const em=document.createElement('em');em.textContent=second;h.append(em);
 p.replaceChildren();desc.split('\n').forEach((line,i)=>{if(i)p.append(document.createElement('br'));p.append(document.createTextNode(line))});
 const enteredUrl=heroModal.querySelector('#heroIconUrl').value.trim();const iconMode=(uploadedPng||enteredUrl)?'image':heroModal.querySelector('#heroIconMode').value,url=uploadedPng||normalizeHeroImageUrl(enteredUrl)||scope.querySelector('.hero-icon-image')?.getAttribute('src')||'';
 if(iconMode==='image'&&!/^(https?:\/\/|data:image\/png;base64,)/i.test(url)){alert('PNG 파일을 선택하거나 이미지 URL을 입력해 주세요.');return}
 scope.dataset.iconMode=iconMode;
 scope.classList.toggle('has-hero-image',iconMode==='image');
 scope.style.display=iconMode==='none'?'none':'';
 const img=scope.querySelector('.hero-icon-image');if(iconMode==='image'){img.onerror=()=>{console.warn('아이콘 이미지 주소를 불러오지 못했습니다:',url);};img.src=url;}else img.removeAttribute('src');
 heroModal.classList.remove('open');
};
const selectors={
 hero:'.hero h1,.hero p',
 quiz:'.quiz .label,.quiz h2,.quiz p',
 hits:'.hits .head h2,.hits .head p,.hits .tab,.hits .case-head .no,.hits .case-head h3,.hits .teacher,.hits .paper-title,.hits .paper h4,.hits .paper,.hits .pointbox',
 proof:'.proof h2,.proof p',
 event:'.eventbox .label,.eventbox h2,.eventbox > p,.eventbox .step,.eventbox .example,.eventbox .event-notice h3,.eventbox .event-notice li'
};
let active=null;
function editTargets(sec){
 const key=['hero','quiz','hits','proof','event'].find(c=>sec.classList.contains(c));
 if(!key)return [];
 let els=Array.from(sec.querySelectorAll(selectors[key]));
 // Prefer smaller independent edit regions. Keep existing rich highlights intact.
 if(key==='event')els=els.filter(el=>!el.matches('.eventbox > p') || true);
 return els;
}
function finish(){
 if(!active)return;
 active.classList.remove('original-editing');
 active.querySelectorAll('[data-original-editable]').forEach(el=>{el.removeAttribute('contenteditable');el.removeAttribute('data-original-editable');el.removeAttribute('spellcheck')});
 const b=active.querySelector('.original-edit-toggle');if(b){b.textContent='수정';b.classList.remove('original-finish')}
 active=null;
}
function start(sec){
 if(sec.classList.contains('hero')){finish();openHeroEditor(sec);return}
 if(active===sec){finish();return}
 finish();active=sec;sec.classList.add('original-editing');
 editTargets(sec).forEach(el=>{el.contentEditable='true';el.dataset.originalEditable='yes';el.spellcheck=false});
 const b=sec.querySelector('.original-edit-toggle');b.textContent='✓ 수정 완료';b.classList.add('original-finish');
 const first=sec.querySelector('[data-original-editable]');if(first)first.focus({preventScroll:true});
}
function move(sec,dir){finish();const siblings=Array.from(document.querySelectorAll('body > section:not(.original-hidden)'));const i=siblings.indexOf(sec);const other=siblings[i+dir];if(!other)return;if(dir<0)other.before(sec);else other.after(sec);}
function makeButton(text,fn,cls=''){
 const b=document.createElement('button');b.type='button';b.textContent=text;if(cls)b.className=cls;
 b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();fn()});return b;
}
function refreshRestore(){const count=originals.filter(s=>s.classList.contains('original-hidden')).length;restore.textContent=count?'숨긴 영역 복구 ('+count+')':'숨긴 영역 복구';}
originals.forEach(sec=>{
 const controls=document.createElement('div');controls.className='original-section-tools';controls.setAttribute('aria-label','기존 영역 편집');
 controls.append(
  makeButton('수정',()=>start(sec),'original-edit-toggle'),
  makeButton('↑ 위로',()=>move(sec,-1)),
  makeButton('↓ 아래로',()=>move(sec,1)),
  makeButton('영역 삭제',()=>{if(confirm('이 영역을 숨길까요? 상단의 숨긴 영역 복구에서 다시 표시할 수 있습니다.')){finish();sec.classList.add('original-hidden');refreshRestore()}})
 );
 sec.prepend(controls);
});
restore.addEventListener('click',()=>{finish();originals.forEach(sec=>sec.classList.remove('original-hidden'));refreshRestore()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){finish();heroModal.classList.remove('open')}});
// The exporter clones the live DOM, preserving edits, visibility and section order.
// Remove editor-only buttons and transient contenteditable attributes from the exported copy.
window.prepareOriginalSectionsExport=clone=>{
 clone.querySelectorAll('.original-section-tools,#restoreOriginalSections,#heroEditModal').forEach(el=>el.remove());
 clone.querySelectorAll('section.original-editing').forEach(el=>el.classList.remove('original-editing'));
 clone.querySelectorAll('[data-original-editable]').forEach(el=>{el.removeAttribute('contenteditable');el.removeAttribute('data-original-editable');el.removeAttribute('spellcheck')});
};
refreshRestore();
})();
</script>
<script id="publish-export-script">
(function(){
'use strict';
const toolbar=document.querySelector('.plan-toolbar');
if(!toolbar)return;
const button=document.createElement('button');
button.type='button';button.id='publishTxtExport';button.textContent='배포용 TXT 저장';
button.title='편집 도구 없이 현재 화면 그대로 노출되는 HTML 소스를 TXT로 저장';
toolbar.append(button);
button.addEventListener('click',()=>{
 const clone=document.documentElement.cloneNode(true);
 // The live document root already contains the currently selected theme variables.
 // Remove sections the author has hidden and every authoring control.
 clone.querySelectorAll('section.original-hidden,.blank-canvas-anchor').forEach(el=>el.remove());
 clone.querySelectorAll('.plan-toolbar,.theme-toolbar,#planLayerV4,#planTipV4,#planStatusV4,#planEditorV4,#customInsertHint,#customSectionModal,.section-tools,.table-tools,.original-section-tools,#restoreOriginalSections,#heroEditModal,.hero-resize-handle,.plan-sticker,.plan-pop,.plan-choose').forEach(el=>el.remove());
 // Remove editing-only scripts, metadata and styles. Keep the public tab/slider script.
 clone.querySelectorAll('style#hero-editor-extra-style').forEach(el=>{el.textContent += '\n.hero .scope.has-hero-image:hover{outline:none!important}';});
 clone.querySelectorAll('script').forEach(el=>{
  if(el.textContent.includes("document.querySelectorAll('.tab').forEach"))return;
  el.remove();
 });
 clone.querySelectorAll('#planning-notes-style,#custom-sections-css,#custom-section-redesign').forEach(el=>{
  // Section layout styles are needed for user-created content, so retain both custom styles.
  if(el.id==='planning-notes-style')el.remove();
 });
 clone.querySelectorAll('[contenteditable],[data-original-editable]').forEach(el=>{
  el.removeAttribute('contenteditable');el.removeAttribute('data-original-editable');el.removeAttribute('spellcheck');
 });
 clone.querySelectorAll('.original-editing,.just-registered,.custom-insert-target').forEach(el=>el.classList.remove('original-editing','just-registered','custom-insert-target'));
 clone.querySelectorAll('whale-quicksearch').forEach(el=>el.remove());
 clone.querySelectorAll('section.custom-section').forEach(sec=>{
  // Ensure no authoring buttons remain, even if the section was edited recently.
  sec.querySelectorAll('button:not(.tab):not(.side-nav)').forEach(el=>el.remove());
 });
 const cleanStyle=clone.ownerDocument.createElement('style');
 cleanStyle.textContent='.custom-section .section-tools,.custom-section .table-tools,.original-section-tools{display:none!important} .custom-section [contenteditable]{outline:none!important}';
 clone.querySelector('head').append(cleanStyle);
 const source='<!doctype html>\n'+clone.outerHTML;
 const blob=new Blob([source],{type:'text/plain;charset=utf-8'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download='page_publish_only.txt';document.body.append(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1500);
});
})();
</script>

<script id="toolbar-position-sync">
(function(){
 const bar=document.querySelector('.plan-toolbar');
 if(!bar)return;
 const sync=()=>{
  const rect=bar.getBoundingClientRect();
  document.documentElement.style.setProperty('--editor-toolbar-bottom',Math.ceil(rect.bottom+12)+'px');
 };
 sync();
 if(typeof ResizeObserver!=='undefined')new ResizeObserver(sync).observe(bar);
 window.addEventListener('resize',sync);
})();
</script>

<script id="blank-builder-runtime">
(function(){
 const anchor=document.getElementById('blank-canvas-anchor');
 if(!anchor)return;
 const update=()=>document.body.classList.toggle('has-custom-sections',!!document.querySelector('section.custom-section'));
 update();
 new MutationObserver(update).observe(document.body,{childList:true});
})();
</script>
